# Alembic configuration for the Onella backend.
#
# The database URL is intentionally NOT hard-coded here. ``alembic/env.py``
# sources it at runtime from the application ``Settings``
# (``settings.database_url``) so migrations always target the same database as
# the running app and honor environment overrides.

[alembic]
# Path to migration scripts, relative to this file.
script_location = alembic

# Template used to generate migration file names; a UTC timestamp prefix keeps
# revisions sortable on disk.
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Use OS-native path separators when interpreting ``script_location``.
prepend_sys_path = .

# Timezone for the ``file_template`` timestamp.
timezone = UTC

# sqlalchemy.url is set programmatically in env.py from Settings.database_url.
# A placeholder is kept so tooling that inspects the file does not fail.
sqlalchemy.url =

[post_write_hooks]
# No post-write hooks configured.

# Logging configuration.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
