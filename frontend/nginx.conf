# nginx config for serving the built SPA in production.
#
# - Serves static assets from /usr/share/nginx/html.
# - SPA history fallback: unknown routes return index.html so client-side
#   routing (react-router BrowserRouter) works on deep links / refresh.
# - Proxies /api to the backend service so the browser talks to one origin
#   (matches the dev-server proxy, so no CORS needed in prod).

upstream backend {
    # Resolves to the `backend` service on the compose network.
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API proxy -> backend service.
    location /api/ {
        proxy_pass http://backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache hashed static assets aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA history fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
